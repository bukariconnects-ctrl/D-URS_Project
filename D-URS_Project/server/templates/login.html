{% extends "layout.html" %}
{% block title %}D-URS - Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill text-primary" style="font-size:3rem"></i>
            <h3 class="mt-2 fw-bold">D-URS Portal</h3>
            <p class="text-muted small">Sign in as Admin or Student</p>
        </div>

        <div class="card shadow-sm border-0" style="border-radius:16px">
            <div class="card-body p-4">
                <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button">Register</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- Login -->
                    <div class="tab-pane fade show active" id="login-pane">
                        <form method="POST" action="/login">
                            <input type="hidden" name="action" value="login">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                            </button>
                        </form>
                    </div>

                    <!-- Register -->
                    <div class="tab-pane fade" id="register-pane">
                        <form method="POST" action="/login">
                            <input type="hidden" name="action" value="register">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-plus"></i></span>
                                    <input type="text" class="form-control" name="username" placeholder="Choose username" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" name="password" placeholder="Choose password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-person-check me-1"></i>Create Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
